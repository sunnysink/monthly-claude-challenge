<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Monthly Claude Challenge — Soul-Forged Founders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3E7; --ink:#211A12; --ink-dim:#544738;
    --copper:#9A6B2E; --copper-lt:#7C5320; --ember:#C25A22; --ember-glow:#D96A2C;
    --gold:#9C7C1E; --forest:#4A6250;
    --copper-rgb:154,107,46; --ember-rgb:194,90,34; --forest-rgb:74,98,80;
    --card-rgb:255,251,244;
    --serif:'Cormorant Garamond','Hoefler Text',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(900px 520px at 10% -10%, rgba(var(--ember-rgb),.13), transparent 60%),
      radial-gradient(820px 500px at 100% 0%, rgba(var(--forest-rgb),.13), transparent 55%);
    min-height:100vh;padding:70px 22px 80px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto}
  header{text-align:center;margin-bottom:44px}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--copper);opacity:.9;margin-bottom:12px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(42px,7vw,68px);line-height:1;
    background:linear-gradient(92deg,var(--copper-lt),var(--ember-glow) 40%,var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink-dim);margin-top:10px}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ink-dim);margin:0 0 16px;display:flex;align-items:center;gap:12px}
  .label::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,rgba(var(--copper-rgb),.35),transparent)}
  a.month{display:block;text-decoration:none;color:inherit;
    background:rgba(var(--card-rgb),.72);border:1px solid rgba(var(--copper-rgb),.22);
    border-radius:16px;padding:24px 26px;margin-bottom:13px;position:relative;overflow:hidden;
    transition:transform .18s,border-color .18s,box-shadow .18s}
  a.month::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--copper),var(--ember),var(--gold))}
  a.month:hover{transform:translateY(-3px);border-color:rgba(var(--ember-rgb),.55);
    box-shadow:0 14px 34px -20px rgba(var(--ember-rgb),.8)}
  a.month .when{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--copper);margin-bottom:7px}
  a.month h2{font-family:var(--serif);font-size:31px;font-weight:600;line-height:1.1}
  a.month p{font-size:14.5px;color:var(--ink-dim);margin-top:6px}
  .live{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:#FFFDFA;background:linear-gradient(135deg,var(--ember),var(--copper));
    padding:4px 10px;border-radius:20px;margin-left:10px;vertical-align:middle}
  footer{margin-top:52px;text-align:center;font-family:var(--mono);font-size:11px;
    color:var(--ink-dim);opacity:.6;line-height:2}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Soul-Forged Founders</div>
    <h1>The Monthly Claude Challenge</h1>
    <div class="sub">Twenty-five squares. One month. Something real at the end of it.</div>
  </header>

  <div class="label">This month</div>
  <a class="month" href="august-made-visible/">
    <div class="when">August 2026</div>
    <h2>Made Visible<span class="live">Live</span></h2>
    <p>Twenty-five ways to put your work where people can actually see it.</p>
  </a>

  <!-- NEXT MONTH: copy the block above, change the folder, the date, the name and the line.
       Move the old one down under a "Past months" label and drop its Live tag. -->

  <footer>
    Soul-Forged Founders<br>
    A new board on the first of every month.
  </footer>
</div>
</body>
</html>
